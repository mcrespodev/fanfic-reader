<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lector Fanfic</title>
  <meta name="description" content="Lector web para fanfic con capítulos, audio y modo oscuro." />

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- CSS propio -->
  <link rel="stylesheet" href="css/style.css" />

  <!-- Tipografías opcionales -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
</head>

<body class="theme-auto d-flex flex-column min-vh-100">
  <noscript>
    <div class="noscript alert alert-warning text-center">Este lector requiere JavaScript para funcionar correctamente.
    </div>
  </noscript>

  <nav class="navbar navbar-expand bg-body-tertiary">
    <div class="container-fluid d-flex justify-content-between align-items-center">

      <!-- Botón menú (abre sidebar) -->
      <button id="btnMenu" class="btn btn-outline-secondary me-2" type="button" data-bs-toggle="offcanvas"
        data-bs-target="#sidebar" aria-controls="sidebar" aria-label="Menú">
        ☰ Capítulos
      </button>

      <!-- Título centrado -->
      <span class="navbar-brand mx-auto fw-bold text-center">
        Mi Fanfic Reader
      </span>

      <!-- Reproductor (o botón de ajustes a la derecha) -->
      <div class="d-flex align-items-center">
        <div class="d-flex align-items-center gap-2">
          <button id="btnAudio" class="btn btn-primary btn-sm" aria-label="Reproducir / Pausar" disabled>▶</button>
          <span id="audioNowPlaying" class="small text-muted" aria-live="polite">Sin canción</span>
          <input id="audioVolume" type="range" class="form-range w-50" min="0" max="1" step="0.01" value="0.2"
            aria-label="Volumen" />
          <div class="dropdown">
            <button class="btn btn-outline-secondary btn-sm dropdown-toggle" type="button" id="playerDropdown"
              data-bs-toggle="dropdown" aria-expanded="false" aria-label="Mostrar controles del reproductor" hidden>
            </button>
            <div class="dropdown-menu dropdown-menu-end p-3" aria-labelledby="playerDropdown" style="min-width: 320px;">
              <label class="form-label mb-1 small" for="audioSeek">Progreso</label>
              <input id="audioSeek" type="range" class="form-range" min="0" max="100" step="0.1" />
              <div class="d-flex align-items-center gap-2 mt-2">
                <button id="btnMute" class="btn btn-outline-secondary btn-sm" aria-label="Silenciar">🔇</button>
              </div>
              <div class="d-flex justify-content-between small text-muted mt-1">
                <time id="audioCurrent">0:00</time>
                <time id="audioDuration">0:00</time>
              </div>
            </div>
          </div>
        </div>
      </div>
  </nav>

  <!-- ======= Contenedor principal ======= -->
  <div>
    <!-- ======= Sidebar: lista de capítulos ======= -->
    <!-- Sidebar como Offcanvas -->
    <div class="offcanvas offcanvas-start" tabindex="-1" id="sidebar" aria-labelledby="sidebarLabel">
      <div class="offcanvas-header">
        <h5 class="offcanvas-title" id="sidebarLabel">Capítulos</h5>
        <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas" aria-label="Cerrar"></button>
      </div>
      <div class="offcanvas-body p-0">
        <!-- Tu lista de capítulos -->
        <ul id="chaptersList" class="list-group list-group-flush">
          <!-- Items se llenan por script -->
        </ul>
      </div>
      <footer class="sidebar-footer p-2 border-top">
        <button id="btnPrev" class="btn btn-primary w-100" title="Continuar donde quedaste">⏳ Previo</button>
        <button id="btnResume" class="btn btn-primary w-100" title="Continuar donde quedaste">⏳ Continuar</button>
        <button id="btnNext" class="btn btn-primary w-100" title="Continuar donde quedaste">⏳ Siguiente</button>
      </footer>
    </div>

    <!-- ======= Área de lectura ======= -->
    <section id="chapterContent" class="chapterContent card-body">
      <div class="mb-3" hidden>
        <img id="chapterCover" class="chapter-cover rounded d-block" alt="Portada" />
        <h2 id="chapterTitle" hidden>...</h2>
        <p id="chapterCode" hidden></p>
      </div>

      <iframe id="pdfFrame" title="Lector PDF (PDF.js)" src="" loading="lazy"
        style="border:1px solid var(--border)"></iframe>
    </section>
  </div>

  <!-- ======= Diálogo de búsqueda ======= -->
  <dialog id="searchDialog" class="dialog">
    <form method="dialog" class="dialog-body">
      <h3>Buscar</h3>
      <input id="searchInput" type="search" class="form-control" placeholder="Título, código…"
        aria-label="Término de búsqueda" />
      <div class="dialog-actions d-flex justify-content-end gap-2 mt-2">
        <button value="cancel" class="btn btn-secondary">Cancelar</button>
        <button id="searchSubmit" class="btn btn-primary" value="search">Buscar</button>
      </div>
    </form>
  </dialog>

  <!-- ======= Diálogo de ajustes ======= -->
  <dialog id="settingsDialog" class="dialog">
    <form method="dialog" class="dialog-body">
      <h3>Ajustes</h3>

      <fieldset class="setting border rounded p-2">
        <legend>Tema</legend>
        <div class="form-check">
          <input type="radio" class="form-check-input" name="theme" value="light" id="themeLight">
          <label class="form-check-label" for="themeLight">Claro</label>
        </div>
        <div class="form-check">
          <input type="radio" class="form-check-input" name="theme" value="dark" id="themeDark">
          <label class="form-check-label" for="themeDark">Oscuro</label>
        </div>
        <div class="form-check">
          <input type="radio" class="form-check-input" name="theme" value="auto" id="themeAuto" checked>
          <label class="form-check-label" for="themeAuto">Automático</label>
        </div>
      </fieldset>

      <fieldset class="setting border rounded p-2">
        <legend>Texto</legend>
        <label for="fontSize" class="form-label">Tamaño</label>
        <input id="fontSize" type="range" class="form-range" min="14" max="22" step="1" value="16" />
        <label for="contentWidth" class="form-label">Ancho de columna</label>
        <input id="contentWidth" type="range" class="form-range" min="560" max="880" step="10" value="720" />
      </fieldset>

      <fieldset class="setting border rounded p-2">
        <legend>Audio</legend>
        <div class="form-check">
          <input id="toggleFade" type="checkbox" class="form-check-input" checked>
          <label class="form-check-label" for="toggleFade">Fundido de entrada/salida</label>
        </div>
        <div class="form-check">
          <input id="autoplay" type="checkbox" class="form-check-input">
          <label class="form-check-label" for="autoplay">Autoreproducir al abrir capítulo</label>
        </div>
      </fieldset>

      <div class="dialog-actions d-flex justify-content-end gap-2 mt-2">
        <button value="cancel" class="btn btn-secondary">Cerrar</button>
        <button id="settingsSave" class="btn btn-primary" value="save">Guardar</button>
      </div>
    </form>
  </dialog>

  <!-- ======= Plantilla ======= -->
  <template id="tplChapterItem">
    <button class="chapter-item btn d-flex align-items-center gap-2 w-100 text-start">
      <img class="chapter-thumb rounded" alt="Portada" width="56" height="56" />
      <span class="chapter-title fw-semibold"></span>
    </button>
  </template>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
  <script src="/js/script.js" defer></script>
</body>

</html>
