<!doctype html>
<html lang="es" data-bs-theme="dark">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MauFic</title>
  <meta name="description" content="Lector web para fanfic con audio." />

  <link rel="icon" type="image/x-icon" href="favicon.ico">


  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- CSS propio -->
  <link rel="stylesheet" href="css/style.css" />

  <!-- Tipografías opcionales -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
</head>

<body class="theme-auto d-flex flex-column min-vh-100">
  <noscript>
    <div class="noscript alert alert-warning text-center">Este lector requiere JavaScript para funcionar correctamente.
    </div>
  </noscript>

  <nav class="navbar navbar-expand bg-body-tertiary">
    <div class="container-fluid d-flex justify-content-between align-items-center">

      <!-- Botón menú (abre sidebar) -->
      <button id="btnMenu" class="btn btn-outline-auto me-2" type="button" data-bs-toggle="offcanvas"
        data-bs-target="#sidebar" aria-controls="sidebar" aria-label="Menú">
        <i class="bi bi-list fs-6"></i>
        <span class="d-none d-md-inline ms-1">Capítulos</span>
      </button>

      <!-- Título centrado -->
      <span class="player-center navbar-brand mx-auto fw-bold text-center">
        MauFic
      </span>

      <!-- Botón menú (abre sidebar) -->
      <button id="btnTema" class="btn btn-outline-auto me-2" aria-label="Tema">
        <span id="labelTema" class="d-none d-md-inline me-1">Modo oscuro</span>
        <i id="iconoTema" class="bi bi-moon-stars-fill"></i>
      </button>

  </nav>

  <nav class="navbar navbar-expand bg-body-tertiary border-top fixed-bottom player-bar">
    <div class="container-fluid position-relative justify-content-between">

      <!-- IZQUIERDA: play + now playing -->
      <div class="player-left d-flex align-items-center gap-2">
        <button id="btnAudio" class="btn btn-primary btn-sm" aria-label="Reproducir / Pausar" disabled>
          <i class="bi bi-play-fill"></i>
        </button>
      </div>

      <!-- CENTRO: progreso (centrado absoluto) -->
      <div class="player-center d-flex align-items-center gap-2">
        <div class="d-flex align-items-center gap-1 small">
          <time id="audioCurrent" class="span-auto">0:00</time><span class="span-auto">/</span><time id="audioDuration"
            class="span-auto">0:00</time>
          <!-- <div id="audioNowPlaying" class="text-truncate" style="max-width: 36vw;">Sin canción</div> -->
          <span id="audioNowPlaying" class="span-auto text-truncate" style="max-width: 36vw;">Sin canción</span>
        </div>
      </div>

      <!-- DERECHA: mute + volumen -->
      <div class="player-right d-flex align-items-center gap-2 ms-auto">
        <button id="btnMute" class="btn btn-outline-auto btn-sm" aria-label="Silenciar" disabled><i
            class="bi bi-volume-up-fill fs-6"></i></button>
        <input id="audioVolume" type="range" class="form-range my-0 d-none d-md-block" min="0" max="1" step="0.01"
          value="0.1" />
      </div>

    </div>
  </nav>

  <!-- ======= Contenedor principal ======= -->
  <div>
    <!-- ======= Sidebar: lista de capítulos ======= -->
    <!-- Sidebar como Offcanvas -->
    <div class="offcanvas offcanvas-start" tabindex="-1" id="sidebar" aria-labelledby="sidebarLabel">
      <div class="offcanvas-header">
        <h5 class="offcanvas-title" id="sidebarLabel">Capítulos</h5>
        <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas" aria-label="Cerrar"></button>
      </div>
      <div class="offcanvas-body p-0">
        <!-- Tu lista de capítulos -->
        <ul id="chaptersList" class="list-group list-group-flush">
          <!-- Items se llenan por script -->
        </ul>
      </div>
      <footer class="sidebar-footer p-2 border-top">
        <button id="btnPrev" class="btn btn-primary w-100" title="Continuar donde quedaste" hidden>⏳ Previo</button>
        <button id="btnResume" class="btn btn-primary w-100" title="Continuar donde quedaste" hidden>⏳
          Continuar</button>
        <button id="btnNext" class="btn btn-primary w-100" title="Continuar donde quedaste" hidden>⏳ Siguiente</button>
      </footer>
    </div>

    <!-- ======= Área de lectura ======= -->
    <section id="chapterContent" class="chapterContent card-body">
      <div class="mb-3" hidden>
        <img id="chapterCover1" class="chapter-cover rounded d-block" alt="Portada" />
        <h2 id="chapterTitle" hidden>...</h2>
        <p id="chapterCode" hidden></p>
      </div>

      <!-- Barra de capítulo (minimal) -->
      <div id="chapterHeader"
        class="chapter-header d-flex justify-content-between align-items-center px-3 py-2 border-bottom bg-body-tertiary">
        <button id="btnPrevChapterBox" class="btn btn-outline-auto btn-sm" aria-label="Capítulo anterior" disabled>
          <i class="bi bi-chevron-left"></i>
          <span class="d-none d-md-inline">Anterior</span>
        </button>

        <div class="chapter-title fw-semibold align-items-center" style="display: flex;">
          <img id="chapterCover" class="chapter-thumb me-2" style="max-width: 32px; max-height: 32px; border-radius: 0;"
            alt="Icono" />
          <div>
            <span id="chapterHeaderChapter" style="display: block; font-size: 12px;" class="span-auto my-0 py-0 fw-light">Capítulo</span>
            <span id="chapterHeaderTitle" style="display: block; font-size: 20px;" class="span-auto my-0 py-0">Portada</span>
            <span id="chapterHeaderPart" style="display: block; font-size: 10px;" class="span-auto my-0 py-0 fw-light">Parte</span>
          </div>
        </div>

        <button id="btnNextChapterBox" class="btn btn-outline-auto btn-sm" aria-label="Capítulo siguiente" disabled>
          <span class="d-none d-md-inline">Siguiente</span>
          <i class="bi bi-chevron-right"></i>
        </button>
      </div>

      <!-- Lector de PDF -->
      <iframe id="pdfFrame" title="Lector PDF (PDF.js)"
        src="pdfjs/web/viewer.html?file=../../pdfs/portada.pdf#zoom=page-fit" loading="lazy"
        style="border:1px solid var(--border)"></iframe>
    </section>
  </div>

  <!-- ======= Diálogo de búsqueda ======= -->
  <dialog id="searchDialog" class="dialog">
    <form method="dialog" class="dialog-body">
      <h3>Buscar</h3>
      <input id="searchInput" type="search" class="form-control" placeholder="Título, código…"
        aria-label="Término de búsqueda" />
      <div class="dialog-actions d-flex justify-content-end gap-2 mt-2">
        <button value="cancel" class="btn btn-secondary">Cancelar</button>
        <button id="searchSubmit" class="btn btn-primary" value="search">Buscar</button>
      </div>
    </form>
  </dialog>

  <!-- ======= Diálogo de ajustes ======= -->
  <dialog id="settingsDialog" class="dialog">
    <form method="dialog" class="dialog-body">
      <h3>Ajustes</h3>

      <fieldset class="setting border rounded p-2">
        <legend>Tema</legend>
        <div class="form-check">
          <input type="radio" class="form-check-input" name="theme" value="light" id="themeLight">
          <label class="form-check-label" for="themeLight">Claro</label>
        </div>
        <div class="form-check">
          <input type="radio" class="form-check-input" name="theme" value="dark" id="themeDark">
          <label class="form-check-label" for="themeDark">Oscuro</label>
        </div>
        <div class="form-check">
          <input type="radio" class="form-check-input" name="theme" value="auto" id="themeAuto" checked>
          <label class="form-check-label" for="themeAuto">Automático</label>
        </div>
      </fieldset>

      <fieldset class="setting border rounded p-2">
        <legend>Texto</legend>
        <label for="fontSize" class="form-label">Tamaño</label>
        <input id="fontSize" type="range" class="form-range" min="14" max="22" step="1" value="16" />
        <label for="contentWidth" class="form-label">Ancho de columna</label>
        <input id="contentWidth" type="range" class="form-range" min="560" max="880" step="10" value="720" />
      </fieldset>

      <fieldset class="setting border rounded p-2">
        <legend>Audio</legend>
        <div class="form-check">
          <input id="toggleFade" type="checkbox" class="form-check-input" checked>
          <label class="form-check-label" for="toggleFade">Fundido de entrada/salida</label>
        </div>
        <div class="form-check">
          <input id="autoplay" type="checkbox" class="form-check-input">
          <label class="form-check-label" for="autoplay">Autoreproducir al abrir capítulo</label>
        </div>
      </fieldset>

      <div class="dialog-actions d-flex justify-content-end gap-2 mt-2">
        <button value="cancel" class="btn btn-secondary">Cerrar</button>
        <button id="settingsSave" class="btn btn-primary" value="save">Guardar</button>
      </div>
    </form>
  </dialog>

  <!-- ======= Plantilla ======= -->
  <template id="tplChapterItem">
    <button class="chapter-item btn btn-outline-auto d-flex align-items-center gap-2 w-95 text-start m-2">
      <img class="chapter-thumb rounded" alt="Portada" width="56" height="56" />
      <span class="chapter-title fw-semibold"></span>
    </button>
  </template>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
  <script src="js/script.js" defer></script>
</body>

</html>
