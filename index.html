<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lector Fanfic</title>
  <meta name="description" content="Lector web para fanfic con capítulos, audio y modo oscuro." />

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- CSS propio -->
  <link rel="stylesheet" href="/css/style.css" />

  <!-- Tipografías opcionales -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
</head>
<body class="theme-auto d-flex flex-column min-vh-100">
  <noscript>
    <div class="noscript alert alert-warning text-center">Este lector requiere JavaScript para funcionar correctamente.</div>
  </noscript>

  <!-- ======= Barra superior ======= -->
  <header class="topbar d-flex align-items-center justify-content-between" role="banner">
    <div class="d-flex align-items-center gap-2">
      <button id="btnMenu" class="btn btn-outline-secondary" aria-label="Abrir/cerrar menú" aria-expanded="false" aria-controls="sidebar">☰</button>
      <h1 class="app-title h5 m-0">Lector de Fanfic</h1>
    </div>

    <div class="topbar-actions d-flex align-items-center gap-2">
      <!-- Player compacto + dropdown (Opción 2) -->
      <div class="d-flex align-items-center gap-2">
        <button id="btnAudio" class="btn btn-primary btn-sm" aria-label="Reproducir / Pausar" disabled>▶</button>
        <span id="audioNowPlaying" class="small text-muted" aria-live="polite">Sin canción</span>
        <div class="dropdown">
          <button class="btn btn-outline-secondary btn-sm dropdown-toggle" type="button" id="playerDropdown" data-bs-toggle="dropdown" aria-expanded="false" aria-label="Mostrar controles del reproductor">
            Controles
          </button>
          <div class="dropdown-menu dropdown-menu-end p-3" aria-labelledby="playerDropdown" style="min-width: 320px;">
            <label class="form-label mb-1 small" for="audioSeek">Progreso</label>
            <input id="audioSeek" type="range" class="form-range" min="0" max="100" step="0.1" />
            <div class="d-flex align-items-center gap-2 mt-2">
              <button id="btnMute" class="btn btn-outline-secondary btn-sm" aria-label="Silenciar">🔇</button>
              <input id="audioVolume" type="range" class="form-range flex-grow-1" min="0" max="1" step="0.01" value="1" aria-label="Volumen" />
            </div>
            <div class="d-flex justify-content-between small text-muted mt-1">
              <time id="audioCurrent">0:00</time>
              <time id="audioDuration">0:00</time>
            </div>
          </div>
        </div>
      </div>

      <!-- Botones de tema y ajustes -->
      <button id="btnTheme" class="btn btn-outline-secondary" aria-label="Cambiar tema" title="Tema">🌓</button>
      <button id="btnSettings" class="btn btn-outline-secondary" aria-haspopup="dialog" aria-controls="settingsDialog" aria-label="Ajustes">⚙️</button>
    </div>
  </header>

  <!-- ======= Contenedor principal ======= -->
  <div class="layout flex-grow-1">
    <!-- ======= Sidebar: lista de capítulos ======= -->
    <aside id="sidebar" class="sidebar" role="navigation" aria-label="Lista de capítulos">
      <div class="sidebar-header d-flex align-items-center justify-content-between p-2 border-bottom">
        <strong>Capítulos</strong>
        <div class="sidebar-tools d-flex gap-2">
          <input id="quickFilter" type="search" class="form-control form-control-sm" placeholder="Filtrar…" aria-label="Filtrar capítulos" />
          <button id="btnClearFilter" class="btn btn-sm btn-outline-secondary" title="Limpiar filtro" aria-label="Limpiar filtro">✕</button>
        </div>
      </div>

      <nav id="chaptersList" class="chapters p-2 overflow-auto">
        <!-- Se llena dinámicamente con script.js usando chapters.json -->
      </nav>

      <footer class="sidebar-footer p-2 border-top">
        <button id="btnResume" class="btn btn-primary w-100" title="Continuar donde quedaste">⏳ Continuar</button>
      </footer>
    </aside>

    <!-- ======= Área de lectura ======= -->
    <main id="reader" class="reader p-3" role="main">
      <article class="chapter card shadow-sm">
        <header class="chapter-header card-header d-flex flex-wrap align-items-center justify-content-between gap-2">
          <div class="chapter-meta d-flex align-items-center gap-3">
            <img id="chapterCover" class="chapter-cover rounded" alt="Portada del capítulo" width="72" height="72" />
            <div class="chapter-headings">
              <h2 id="chapterTitle" class="h5 m-0">Selecciona un capítulo</h2>
              <p id="chapterCode" class="chapter-code small text-muted" aria-live="polite"></p>
            </div>
          </div>

          <div class="chapter-controls d-flex gap-2">
            <button id="btnPrev" class="btn btn-outline-secondary" disabled>← Anterior</button>
            <button id="btnNext" class="btn btn-outline-secondary" disabled>Siguiente →</button>
          </div>
        </header>

        <section id="chapterContent" class="chapter-content card-body" aria-live="polite">
          <div class="placeholder text-center text-muted">
            <p>Elige un capítulo de la lista para comenzar a leer.</p>
          </div>
        </section>

        <!-- Barra de progreso -->
        <div class="progress-wrap">
          <div class="progress">
            <div class="progress-bar" id="readingProgress" style="width:0%"></div>
          </div>
        </div>
      </article>
    </main>
  </div>

  <!-- ======= Diálogo de búsqueda ======= -->
  <dialog id="searchDialog" class="dialog">
    <form method="dialog" class="dialog-body">
      <h3>Buscar</h3>
      <input id="searchInput" type="search" class="form-control" placeholder="Título, código…" aria-label="Término de búsqueda" />
      <div class="dialog-actions d-flex justify-content-end gap-2 mt-2">
        <button value="cancel" class="btn btn-secondary">Cancelar</button>
        <button id="searchSubmit" class="btn btn-primary" value="search">Buscar</button>
      </div>
    </form>
  </dialog>

  <!-- ======= Diálogo de ajustes ======= -->
  <dialog id="settingsDialog" class="dialog">
    <form method="dialog" class="dialog-body">
      <h3>Ajustes</h3>

      <fieldset class="setting border rounded p-2">
        <legend>Tema</legend>
        <div class="form-check">
          <input type="radio" class="form-check-input" name="theme" value="light" id="themeLight">
          <label class="form-check-label" for="themeLight">Claro</label>
        </div>
        <div class="form-check">
          <input type="radio" class="form-check-input" name="theme" value="dark" id="themeDark">
          <label class="form-check-label" for="themeDark">Oscuro</label>
        </div>
        <div class="form-check">
          <input type="radio" class="form-check-input" name="theme" value="auto" id="themeAuto" checked>
          <label class="form-check-label" for="themeAuto">Automático</label>
        </div>
      </fieldset>

      <fieldset class="setting border rounded p-2">
        <legend>Texto</legend>
        <label for="fontSize" class="form-label">Tamaño</label>
        <input id="fontSize" type="range" class="form-range" min="14" max="22" step="1" value="16" />
        <label for="contentWidth" class="form-label">Ancho de columna</label>
        <input id="contentWidth" type="range" class="form-range" min="560" max="880" step="10" value="720" />
      </fieldset>

      <fieldset class="setting border rounded p-2">
        <legend>Audio</legend>
        <div class="form-check">
          <input id="toggleFade" type="checkbox" class="form-check-input" checked>
          <label class="form-check-label" for="toggleFade">Fundido de entrada/salida</label>
        </div>
        <div class="form-check">
          <input id="autoplay" type="checkbox" class="form-check-input">
          <label class="form-check-label" for="autoplay">Autoreproducir al abrir capítulo</label>
        </div>
      </fieldset>

      <div class="dialog-actions d-flex justify-content-end gap-2 mt-2">
        <button value="cancel" class="btn btn-secondary">Cerrar</button>
        <button id="settingsSave" class="btn btn-primary" value="save">Guardar</button>
      </div>
    </form>
  </dialog>

  <!-- ======= Plantilla ======= -->
  <template id="tplChapterItem">
    <button class="chapter-item btn d-flex align-items-center gap-2 w-100 text-start">
      <img class="chapter-thumb rounded" alt="Portada" width="56" height="56" />
      <span class="chapter-title fw-semibold"></span>
    </button>
  </template>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
  <script src="/js/script.js" defer></script>
</body>
</html>
